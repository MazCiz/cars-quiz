services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: carsquiz
      POSTGRES_PASSWORD: carsquiz
      POSTGRES_DB: cars_quiz
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Browser-based DB viewer — http://localhost:8080
  # (server: postgres, user/pass: carsquiz, database: cars_quiz)
  adminer:
    image: adminer:latest
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      - postgres

volumes:
  pgdata:
